plugins {
    id 'fabric-loom' version '1.15-SNAPSHOT'
    id 'maven-publish'
    id 'com.gradleup.shadow' version '9.3.0'
}

version = project.mod_version
group = project.maven_group
cloth_config_version = project.cloth_config_version
modmenu_version = project.modmenu_version

base {
    archivesName = project.archives_base_name
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "dungeoncraft" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://maven.shedaniel.me/' }
    maven {
        name = 'Terraformers'
        url = 'https://maven.terraformersmc.com/'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"

    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    modApi ("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }

    modImplementation "com.terraformersmc:modmenu:${project.modmenu_version}"

    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'

    implementation 'org.yaml:snakeyaml:2.2'
    implementation 'com.zaxxer:HikariCP:5.1.0'
    implementation 'com.mysql:mysql-connector-j:8.4.0'

    implementation 'at.favre.lib:bcrypt:0.9.0'
    implementation 'at.favre.lib:bytes:1.5.0'
}

tasks.shadowJar {
    archiveClassifier.set("dev-shadow")

    from(sourceSets.main.output)
    from(sourceSets.client.output)

    // include ONLY external dependencies
    dependencies {
        include(dependency("org.yaml:snakeyaml:.*"))
        include(dependency("com.zaxxer:HikariCP:.*"))
        include(dependency("com.mysql:mysql-connector-j:.*"))
        include(dependency("at.favre.lib:bcrypt:.*"))
        include(dependency("at.favre.lib:bytes:.*"))
    }

    // relocate to avoid conflicts with other mods
    relocate "org.yaml.snakeyaml", "${project.group}.shadow.snakeyaml"
    relocate "com.zaxxer.hikari", "${project.group}.shadow.hikari"
    relocate "com.mysql.cj", "${project.group}.shadow.mysql"
    relocate "at.favre.lib.crypto.bcrypt", "${project.group}.shadow.bcrypt"
    relocate "at.favre.lib.bytes", "${project.group}.shadow.bytes"

    mergeServiceFiles()
}

tasks.remapJar {
    dependsOn tasks.shadowJar
    inputFile.set(tasks.shadowJar.archiveFile)
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    inputs.property "cloth_config_version", project.cloth_config_version
    inputs.property "modmenu_version", project.modmenu_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand(
                "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version,
                "cloth_config_version": project.cloth_config_version,
                "modmenu_version": project.modmenu_version
        )
    }
}

def targetJavaVersion = 21

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
}
