name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: develop

      - name: Setup Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Read version
        id: v
        run: |
          VERSION=$(grep "^mod_version=" gradle.properties | cut -d'=' -f2)
          RELEASE=${VERSION%-SNAPSHOT}
          echo "release=$RELEASE" >> $GITHUB_OUTPUT

      - name: Set release version
        run: |
          sed -i "s/^mod_version=.*/mod_version=${{ steps.v.outputs.release }}/" gradle.properties
          git add gradle.properties
          git commit -m "Release v${{ steps.v.outputs.release }}"

      - name: Merge into master
        run: |
          git checkout master
          git merge --no-ff develop -m "Release v${{ steps.v.outputs.release }}"

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew clean build

      - name: Tag release
        run: |
          git tag "v${{ steps.v.outputs.release }}"

      - name: Push master + tags
        run: |
          git push origin master
          git push origin --tags

      - name: Return to develop
        run: |
          git checkout develop

      - name: Merge master back (code only)
        run: |
          git merge --no-ff master

      - name: Bump minor version
        run: |
          VERSION=${{ steps.v.outputs.release }}

          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          NEXT_MINOR=$((MINOR + 1))
          NEXT_VERSION="$MAJOR.$NEXT_MINOR.0-SNAPSHOT"

          sed -i "s/^mod_version=.*/mod_version=$NEXT_VERSION/" gradle.properties

          git add gradle.properties
          git commit -m "Start next dev cycle $NEXT_VERSION"

      - name: Push develop
        run: |
          git push origin develop