name: Hotfix

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to patch (e.g. v1.2.0)"
        required: true

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}

      - name: Setup Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create hotfix branch
        run: |
          git checkout -b hotfix/${{ inputs.tag }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Compute patch version
        id: v
        run: |
          BASE=${{ inputs.tag }}
          BASE=${BASE#v}

          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE"

          NEXT_PATCH=$((PATCH + 1))
          VERSION="$MAJOR.$MINOR.$NEXT_PATCH"

          echo "version=$VERSION" >> $GITHUB_OUTPUT

          sed -i "s/^version=.*/version=$VERSION/" gradle.properties
          git add gradle.properties
          git commit -m "Hotfix v$VERSION"

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew clean build

      - name: Tag hotfix
        run: |
          git tag "v${{ steps.v.outputs.version }}"

      - name: Push hotfix
        run: |
          git push origin HEAD
          git push origin --tags

      - name: Merge into master
        run: |
          git checkout master
          git merge hotfix/${{ inputs.tag }} --no-ff
          git push origin master

      - name: Merge into develop (CODE ONLY, NOT VERSION)
        run: |
          git checkout develop
          git merge hotfix/${{ inputs.tag }} --no-ff

      - name: Restore develop version (prevent drift)
        run: |
          DEV_VERSION=$(grep "^version=" gradle.properties | cut -d'=' -f2)

          # ensure it stays SNAPSHOT-based (do NOT downgrade)
          echo "Keeping develop version: $DEV_VERSION"

          git add gradle.properties || true
          git commit -m "Merge hotfix code into develop (no version change)" || true

      - name: Push develop
        run: |
          git push origin develop