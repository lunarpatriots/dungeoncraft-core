name: Release

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: develop

      - name: Setup Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Read current version
        id: version
        run: |
          CURRENT_VERSION=$(grep "^version=" gradle.properties | cut -d'=' -f2)

          RELEASE_VERSION=${CURRENT_VERSION%-SNAPSHOT}

          echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          echo "release_version=$RELEASE_VERSION" >> $GITHUB_OUTPUT

      - name: Set release version
        run: |
          sed -i "s/^version=.*/version=${{ steps.version.outputs.release_version }}/" gradle.properties

          git add gradle.properties
          git commit -m "Release v${{ steps.version.outputs.release_version }}"

      - name: Merge develop into master
        run: |
          git checkout master
          git merge --no-ff develop -m "Release v${{ steps.version.outputs.release_version }}"

      - name: Build artifact
        run: |
          chmod +x gradlew
          ./gradlew clean build

      - name: Create tag
        run: |
          git tag "v${{ steps.version.outputs.release_version }}"

      - name: Push master and tag
        run: |
          git push origin master
          git push origin --tags

      - name: Return to develop
        run: |
          git checkout develop

      - name: Merge master back into develop
        run: |
          git merge --no-ff master -m "Merge master back into develop"

      - name: Increment snapshot version
        run: |
          VERSION="${{ steps.version.outputs.release_version }}"

          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          NEXT_PATCH=$((PATCH + 1))
          NEXT_VERSION="$MAJOR.$MINOR.$NEXT_PATCH-SNAPSHOT"

          sed -i "s/^version=.*/version=$NEXT_VERSION/" gradle.properties

          git add gradle.properties
          git commit -m "Prepare next development iteration $NEXT_VERSION"

      - name: Push develop
        run: |
          git push origin develop